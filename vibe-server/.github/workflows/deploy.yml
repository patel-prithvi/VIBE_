name: Deploy vibe-server to AWS EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/var/www/vibe-server"
            mkdir -p $APP_DIR

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
              cd $APP_DIR
            else
              cd $APP_DIR
              git fetch origin && git reset --hard origin/${{ github.ref_name }}
            fi

            cat << 'EOF' > .env
            PORT=${{ secrets.PORT || 8000 }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            JWT_ACCESSTOKEN_SECRET=${{ secrets.JWT_ACCESSTOKEN_SECRET }}
            JWT_ACCESSTOKEN_EXPIRY=${{ secrets.JWT_ACCESSTOKEN_EXPIRY || '1d' }}
            JWT_REFRESHTOKEN_SECRET=${{ secrets.JWT_REFRESHTOKEN_SECRET }}
            JWT_REFRESHTOKEN_EXPIRY=${{ secrets.JWT_REFRESHTOKEN_EXPIRY || '7d' }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            ZOHO_REGION=${{ secrets.ZOHO_REGION || 'com' }}
            ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
            ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
            ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
            ZOHO_ACCOUNT_ID=${{ secrets.ZOHO_ACCOUNT_ID }}
            ZOHO_FROM_EMAIL=${{ secrets.ZOHO_FROM_EMAIL }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_KEY=${{ secrets.SMTP_KEY }}
            EOF

            npm ci --omit=dev || npm install --omit=dev
            pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save
            
            sleep 3
            curl --fail http://localhost:8000/api/v1/health
